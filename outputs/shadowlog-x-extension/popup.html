<!doctype html><html lang="ja"><meta charset="utf-8"><title>SHADOWLOG QR Collector</title><link rel="stylesheet" href="popup.css"><body><h1>SHADOWLOG <small>QR Collector</small></h1><p>Xを検索してスクロール。表示された投稿画像のQRを集めます。</p><div class="actions"><button id="start">このX画面で開始</button><button id="stop">停止</button></div><p id="status" role="status"></p><p class="hint">開始後はこの小窓を閉じてスクロールできます。再度開くと結果を確認できます。1回100画像まで。</p><h2>検出したデッキ <span id="count">0</span></h2><button id="select-all" class="secondary">先頭30件を選択</button><div id="items"></div><button id="transfer">選択したデッキを比較へ送る</button><button id="clear" class="secondary">一覧を空にする</button><p class="hint">先にSHADOWLOGの start.cmd を起動してください。同じChrome／Edgeの保存領域に追加されます。画像自体は保存しません。</p><script type="module" src="popup.js"></script></body></html>
